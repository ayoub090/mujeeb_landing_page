name: Publish production images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "acquisition/**"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: dashboard
            context: frontend
          - name: acquisition
            context: acquisition
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ghcr.io/ayoub090/mujeeb-${{ matrix.name }}:latest
          build-args: |
            VITE_API_URL=https://api.usemujeeb.com
            VITE_META_APP_ID=1037675092312673
            VITE_META_CONFIG_ID=
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
