<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" width="100%" height="100%">
  <defs>
    <!-- Subtle Shadow -->
    <filter id="prod-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@700&family=Inter:wght@800&display=swap');
    .prod-latin {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: #17231F;
      letter-spacing: -0.5px;
    }
    .prod-arabic {
      font-family: 'Alexandria', system-ui, sans-serif;
      font-weight: 700;
      font-size: 24px;
      fill: #116149;
    }
    .prod-divider {
      fill: #CBD5E1;
      font-size: 24px;
    }
  </style>

  <!-- Product Logo Mark (Rounded Square with Meem) -->
  <g transform="translate(10, 10)" filter="url(#prod-shadow)">
    <!-- Rounded Rectangle Background -->
    <rect x="2" y="2" width="76" height="76" rx="20" ry="20" fill="#E7AA51" />
    
    <!-- Modern Geometric 'م' (Meem) Lettermark in Dark Forest Green -->
    <path d="M 42 22 
             C 50 22 56.5 28.5 56.5 36.5 
             C 56.5 44.5 50 51 42 51 
             C 34 51 27.5 44.5 27.5 36.5 
             C 27.5 28.5 34 22 42 22 Z 
             M 42 30 
             C 38.4 30 35.5 32.9 35.5 36.5 
             C 35.5 40.1 38.4 43 42 43 
             C 45.6 43 48.5 40.1 48.5 36.5 
             C 48.5 32.9 45.6 30 42 30 Z
             M 48.5 36.5
             C 48.5 46.5 40.7 59 24 63
             C 21.9 63.5 22.3 61 24 59.8
             C 37.5 52 40.5 43.6 40.5 36.5 Z" 
          fill="#102A22" />
  </g>

  <!-- Brand Typography -->
  <!-- Latin Name -->
  <text x="105" y="52" class="prod-latin">Mujeeb</text>
  
  <!-- Visual Divider -->
  <text x="232" y="48" class="prod-divider">|</text>
  
  <!-- Arabic Name -->
  <text x="252" y="49" class="prod-arabic">مجيب</text>
</svg>
