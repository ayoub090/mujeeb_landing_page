<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" width="100%" height="100%">
  <defs>
    <!-- Marketing Sleek Tech Gradient -->
    <linearGradient id="tech-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="svg-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@700&family=Inter:wght@800&display=swap');
    .text-latin {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: #1E3A8A;
      letter-spacing: -0.5px;
    }
    .text-arabic {
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      font-weight: 700;
      font-size: 26px;
      fill: #059669;
    }
    .text-divider {
      fill: #E2E8F0;
      font-size: 24px;
    }
  </style>

  <!-- Logo Mark (Circle with Meem) -->
  <g transform="translate(10, 10)" filter="url(#svg-shadow)">
    <!-- Background circle with tech gradient -->
    <circle cx="40" cy="40" r="38" fill="url(#tech-grad)" />
    
    <!-- Outer border accent ring -->
    <circle cx="40" cy="40" r="36" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.25" />

    <!-- Modern Geometric 'م' (Meem) Lettermark in White -->
    <path d="M 41.5 22 
             C 49.5 22 56 28.5 56 36.5 
             C 56 44.5 49.5 51 41.5 51 
             C 33.5 51 27 44.5 27 36.5 
             C 27 28.5 33.5 22 41.5 22 Z 
             M 41.5 30 
             C 37.9 30 35 32.9 35 36.5 
             C 35 40.1 37.9 43 41.5 43 
             C 45.1 43 48 40.1 48 36.5 
             C 48 32.9 45.1 30 41.5 30 Z
             M 48 36.5
             C 48 46.5 40.2 59 23.5 63
             C 21.4 63.5 21.8 61 23.5 59.8
             C 37 52 40 43.6 40 36.5 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <!-- Latin Name -->
  <text x="105" y="52" class="text-latin">Mujeeb</text>
  
  <!-- Visual Divider -->
  <text x="232" y="48" class="text-divider">|</text>
  
  <!-- Arabic Name -->
  <text x="252" y="49" class="text-arabic">مجيب</text>
</svg>
