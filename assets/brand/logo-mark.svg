<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Marketing Sleek Tech Gradient -->
    <linearGradient id="tech-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Product Calming Heritage Gradient -->
    <linearGradient id="product-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#116149" />
      <stop offset="100%" stop-color="#E7AA51" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background circle with tech gradient -->
  <circle cx="50" cy="50" r="46" fill="url(#tech-gradient)" filter="url(#shadow)" />
  
  <!-- Outer border accent ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Modern Geometric 'م' (Meem) Lettermark in White -->
  <path d="M 52 28 
           C 61.94 28 70 36.06 70 46 
           C 70 55.94 61.94 64 52 64 
           C 42.06 64 34 55.94 34 46 
           C 34 36.06 42.06 28 52 28 Z 
           M 52 38 
           C 47.58 38 44 41.58 44 46 
           C 44 50.42 47.58 54 52 54 
           C 56.42 54 60 50.42 60 46 
           C 60 41.58 56.42 38 52 38 Z
           M 60 46
           C 60 58 50.5 73 30 78
           C 27.5 78.6 28 75.5 30 74
           C 46.5 64.5 50 54.5 50 46 Z" 
        fill="#FFFFFF" />
</svg>
