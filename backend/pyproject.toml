[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujeeb-api"
version = "0.1.0"
description = "Mujeeb WhatsApp Revenue OS API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "cryptography>=45,<46",
  "httpx>=0.28,<1",
  "phonenumbers>=9.0,<10",
  "redis>=6,<7",
  "celery>=5.5,<6",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
