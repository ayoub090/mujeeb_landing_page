services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mujeeb
      POSTGRES_USER: mujeeb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U mujeeb"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
    command: ["python", "-m", "app.worker"]
  dashboard:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.usemujeeb.com}
        VITE_META_APP_ID: ${VITE_META_APP_ID:-}
        VITE_META_CONFIG_ID: ${VITE_META_CONFIG_ID:-}
        VITE_META_EMBEDDED_SIGNUP_ENABLED: ${VITE_META_EMBEDDED_SIGNUP_ENABLED:-false}
    restart: unless-stopped
    depends_on: [api]
  ollama:
    image: ollama/ollama:latest
    profiles: ["acquisition"]
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
  acquisition:
    build: ./acquisition
    profiles: ["acquisition"]
    restart: unless-stopped
    environment:
      ACQUISITION_ADMIN_KEY: ${ACQUISITION_ADMIN_KEY}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on: [ollama]
    ports: ["127.0.0.1:18080:8080"]
volumes: {postgres_data: {}, redis_data: {}, ollama_data: {}}
