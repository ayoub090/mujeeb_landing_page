services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mujeeb
      POSTGRES_USER: mujeeb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U mujeeb"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
  dashboard:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.usemujeeb.com}
        VITE_META_APP_ID: ${VITE_META_APP_ID:-}
        VITE_META_CONFIG_ID: ${VITE_META_CONFIG_ID:-}
    restart: unless-stopped
    depends_on: [api]
volumes: {postgres_data: {}, redis_data: {}}
