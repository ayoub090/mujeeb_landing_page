services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mujeeb
      POSTGRES_USER: mujeeb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mujeeb"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  api:
    image: ghcr.io/ayoub090/mujeeb-api:latest
    restart: unless-stopped
    environment: &api-environment
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mujeeb:${POSTGRES_PASSWORD}@postgres:5432/mujeeb
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: https://app.usemujeeb.com
      COOKIE_DOMAIN: .usemujeeb.com
      JWT_SECRET: ${JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      TRUST_PROXY_HEADERS: "true"
      GCC_ONLY_SIGNUPS: ${GCC_ONLY_SIGNUPS:-false}
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_CONFIG_ID: ${META_CONFIG_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_WABA_ID: ${META_WABA_ID:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-27526928870340659}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_EMBEDDED_SIGNUP_REDIRECT_URI: ${META_EMBEDDED_SIGNUP_REDIRECT_URI:-}
      META_EMBEDDED_SIGNUP_ENABLED: ${META_EMBEDDED_SIGNUP_ENABLED:-false}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      WAAPI_BASE_URL: ${WAAPI_BASE_URL:-https://waapi.app/api/v1}
      WAAPI_API_TOKEN: ${WAAPI_API_TOKEN:-}
      WAAPI_WEBHOOK_BASE_URL: ${WAAPI_WEBHOOK_BASE_URL:-https://api.usemujeeb.com/api/waapi/webhooks}
      SALLA_CLIENT_ID: ${SALLA_CLIENT_ID:-}
      SALLA_CLIENT_SECRET: ${SALLA_CLIENT_SECRET:-}
      SALLA_REDIRECT_URI: https://api.usemujeeb.com/api/integrations/salla/callback
      SALLA_WEBHOOK_SECRET: ${SALLA_WEBHOOK_SECRET:-}
      ZID_CLIENT_ID: ${ZID_CLIENT_ID:-}
      ZID_CLIENT_SECRET: ${ZID_CLIENT_SECRET:-}
      ZID_REDIRECT_URI: https://api.usemujeeb.com/api/integrations/zid/callback
      ZID_WEBHOOK_SECRET: ${ZID_WEBHOOK_SECRET:-}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      SHOPIFY_REDIRECT_URI: https://api.usemujeeb.com/api/integrations/shopify/callback
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2026-07}
      CREEM_API_KEY: ${CREEM_API_KEY:-}
      CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET:-}
      CREEM_API_BASE: ${CREEM_API_BASE:-https://api.creem.io}
      CREEM_PRODUCT_STARTER: ${CREEM_PRODUCT_STARTER:-}
      CREEM_PRODUCT_GROWTH: ${CREEM_PRODUCT_GROWTH:-}
      CREEM_PRODUCT_SCALE: ${CREEM_PRODUCT_SCALE:-}
      APP_BASE_URL: https://api.usemujeeb.com
      ANALYTICS_ADMIN_KEY: ${ANALYTICS_ADMIN_KEY}
      ACQUISITION_ADMIN_KEY: ${ACQUISITION_ADMIN_KEY:-}
      ACQUISITION_SCRAPER_URL: ${ACQUISITION_SCRAPER_URL:-http://acquisition:8080}
      ACQUISITION_DAILY_LIMIT: ${ACQUISITION_DAILY_LIMIT:-30}
      ACQUISITION_AUTO_SEND_ENABLED: ${ACQUISITION_AUTO_SEND_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_BASE: ${RESEND_API_BASE:-https://api.resend.com}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Mujeeb}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Mujeeb}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_BASE: ${RESEND_API_BASE:-https://api.resend.com}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Mujeeb}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Mujeeb}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PRIVACY_DELETION_GRACE_DAYS: ${PRIVACY_DELETION_GRACE_DAYS:-7}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-chat-v3.1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-https://usemujeeb.com}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Mujeeb}
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution_api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-mujeeb_evo_admin_sec_2026}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    ports: ["127.0.0.1:18000:8000"]
  worker:
    image: ghcr.io/ayoub090/mujeeb-api:latest
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["python", "-m", "app.worker"]
  dashboard:
    image: ghcr.io/ayoub090/mujeeb-dashboard:latest
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:13000:80"]
  evolution_api:
    image: atendai/evolution-api:v2.2.2
    restart: unless-stopped
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-mujeeb_evo_admin_sec_2026}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/2
      CACHE_REDIS_TTL: 604800
      CACHE_REDIS_SAVE_INSTANCES: "true"
      DEL_INSTANCE: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: "Mujeeb Outreach"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      LOG_LEVEL: "ERROR,WARN,DEBUG,INFO"
      QRCODE_LIMIT: 30
    ports:
      - "127.0.0.1:18085:8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      redis: {condition: service_started}
volumes:
  postgres_data:
  redis_data:
  evolution_instances:
