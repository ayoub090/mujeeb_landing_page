services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mujeeb
      POSTGRES_USER: mujeeb
      POSTGRES_PASSWORD: 
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mujeeb"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  api:
    image: ghcr.io/ayoub090/mujeeb-api:latest
    restart: unless-stopped
    environment: &api-environment
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mujeeb:@postgres:5432/mujeeb
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: https://app.usemujeeb.com
      COOKIE_DOMAIN: .usemujeeb.com
      JWT_SECRET: 
      DATA_ENCRYPTION_KEY: 
      TRUST_PROXY_HEADERS: "true"
      GCC_ONLY_SIGNUPS: 
      MAXMIND_ACCOUNT_ID: 
      MAXMIND_LICENSE_KEY: 
      META_APP_ID: 
      META_APP_SECRET: 
      META_CONFIG_ID: 
      META_GRAPH_VERSION: 
      META_WEBHOOK_VERIFY_TOKEN: 
      META_WABA_ID: 
      META_PHONE_NUMBER_ID: 
      META_ACCESS_TOKEN: 
      META_PIXEL_ID: 
      META_CAPI_ACCESS_TOKEN: 
      META_EMBEDDED_SIGNUP_REDIRECT_URI: 
      META_EMBEDDED_SIGNUP_ENABLED: 
      GOOGLE_MAPS_API_KEY: 
      N8N_WEBHOOK_URL: 
      N8N_SHARED_SECRET: 
      WAAPI_BASE_URL: 
      WAAPI_API_TOKEN: 
      WAAPI_WEBHOOK_BASE_URL: 
      SALLA_CLIENT_ID: 
      SALLA_CLIENT_SECRET: 
      SALLA_REDIRECT_URI: https://api.usemujeeb.com/api/integrations/salla/callback
      SALLA_WEBHOOK_SECRET: 
      ZID_CLIENT_ID: 
      ZID_CLIENT_SECRET: 
      ZID_REDIRECT_URI: https://api.usemujeeb.com/api/integrations/zid/callback
      ZID_WEBHOOK_SECRET: 
      SHOPIFY_CLIENT_ID: 
      SHOPIFY_CLIENT_SECRET: 
      SHOPIFY_REDIRECT_URI: https://api.usemujeeb.com/api/integrations/shopify/callback
      SHOPIFY_API_VERSION: 
      CREEM_API_KEY: 
      CREEM_WEBHOOK_SECRET: 
      CREEM_API_BASE: 
      CREEM_PRODUCT_STARTER: 
      CREEM_PRODUCT_GROWTH: 
      CREEM_PRODUCT_SCALE: 
      APP_BASE_URL: https://api.usemujeeb.com
      ANALYTICS_ADMIN_KEY: 
      ACQUISITION_ADMIN_KEY: 
      ACQUISITION_SCRAPER_URL: 
      ACQUISITION_DAILY_LIMIT: 
      ACQUISITION_AUTO_SEND_ENABLED: 
      TELEGRAM_BOT_TOKEN: 
      TELEGRAM_CHAT_ID: 
      RESEND_API_KEY: 
      RESEND_API_BASE: 
      RESEND_FROM_EMAIL: 
      RESEND_FROM_NAME: 
      SMTP_HOST: 
      SMTP_PORT: 
      SMTP_USERNAME: 
      SMTP_PASSWORD: 
      SMTP_FROM_EMAIL: 
      SMTP_FROM_NAME: 
      SMTP_USE_TLS: 
      PRIVACY_DELETION_GRACE_DAYS: 
      OPENROUTER_API_KEY: 
      OPENROUTER_BASE_URL: 
      OPENROUTER_MODEL: 
      OPENROUTER_HTTP_REFERER: 
      OPENROUTER_APP_NAME: 
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mujeeb-api.rule=Host("api.usemujeeb.com")
      - traefik.http.routers.mujeeb-api.entrypoints=websecure
      - traefik.http.routers.mujeeb-api.tls.certresolver=letsencrypt
      - traefik.http.services.mujeeb-api.loadbalancer.server.port=8000
    ports: ["127.0.0.1:18000:8000"]
  worker:
    image: ghcr.io/ayoub090/mujeeb-api:latest
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["python", "-m", "app.worker"]
  dashboard:
    image: ghcr.io/ayoub090/mujeeb-dashboard:latest
    restart: unless-stopped
    depends_on: [api]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mujeeb.rule=Host("usemujeeb.com") || Host("www.usemujeeb.com")
      - traefik.http.routers.mujeeb.entrypoints=websecure
      - traefik.http.routers.mujeeb.tls.certresolver=letsencrypt
      - traefik.http.services.mujeeb.loadbalancer.server.port=80
    ports: ["127.0.0.1:13000:80"]
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
  acquisition:
    image: ghcr.io/ayoub090/mujeeb-acquisition:latest
    restart: unless-stopped
    environment:
      ACQUISITION_ADMIN_KEY: 8ca1b0f2523a1a616d9c2c303c5271e728328958dbdfe624d687ad5f6a7912c7
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on: [ollama]
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.usemujeeb.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.usemujeeb.com/
      - GENERIC_TIMEZONE=Asia/Riyadh
      - N8N_SECURE_COOKIE=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    ports:
      - "5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host("n8n.usemujeeb.com")
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls.certresolver=letsencrypt
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  postgres_data:
  redis_data:
  ollama_data:
  n8n_data:
