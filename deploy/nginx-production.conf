server {
  listen 80;
  listen [::]:80;
  server_name usemujeeb.com app.usemujeeb.com api.usemujeeb.com;
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name usemujeeb.com app.usemujeeb.com;
  ssl_certificate /etc/letsencrypt/live/usemujeeb.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/usemujeeb.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / {
    proxy_pass http://dashboard:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.usemujeeb.com;
  client_max_body_size 2m;
  ssl_certificate /etc/letsencrypt/live/usemujeeb.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/usemujeeb.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location ^~ /api/v1/webhooks/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }
  location / {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
